name: registry

services:
  backend:
    build:
      context: ../registry-be
      dockerfile: Dockerfile
    image: registry-be:dev
    env_file:
      # 原样传递实际配置，避免密钥中的 $ 被 Compose 插值。
      - path: ../registry-be/.env
        format: raw
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-registry}
      MYSQL_USER: ${MYSQL_USER:-registry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MySQL 业务账号密码}
      MIDDLEWARE_BASE_URL: ${MIDDLEWARE_BASE_URL:-http://host.docker.internal:22000}
      # 同一 Compose 网络内通过服务名访问知识后端。
      KNOWLEDGE_ACCUMULATION_BASE_URL: ${KNOWLEDGE_ACCUMULATION_BASE_URL:-http://knowledge-backend:8000}
      SQLITE_PATH: /workspace/data/review-log/registry.db
      RESOURCE_ROOT: /workspace/data/resource
      REVIEW_LOG_ROOT: /workspace/data/review-log
    ports:
      - "127.0.0.1:${BACKEND_PORT:-23000}:8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - backend-data:/workspace/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - registry
    init: true
    restart: unless-stopped

  knowledge-backend:
    build:
      context: ../knowledge-accumulation-be
      dockerfile: Dockerfile
    image: knowledge-accumulation-be:dev
    environment:
      # 与 registry 共用权威人员库，避免权限和管理员关系出现副本。
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-registry}
      MYSQL_USER: ${MYSQL_USER:-registry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MySQL 业务账号密码}
      # 文件检索与鉴权读取 registry 的同一权威源，覆盖挂载配置中的本机连接项。
      FILE_SOURCE_MYSQL_HOST: mysql
      FILE_SOURCE_MYSQL_PORT: "3306"
      FILE_SOURCE_MYSQL_DATABASE: ${MYSQL_DATABASE:-registry}
      FILE_SOURCE_MYSQL_USER: ${MYSQL_USER:-registry}
      FILE_SOURCE_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MySQL 业务账号密码}
      REGISTRY_BASE_URL: http://backend:8000
      MIDDLEWARE_BASE_URL: ${MIDDLEWARE_BASE_URL:-http://host.docker.internal:22000}
      MIDDLEWARE_PLATFORM_CODE: knowledge-accumulation
      # 与前端构建共用公开企业标识；应用密钥仍只读取后端配置。
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
      AVATAR_ROOT: /workspace/data/user/avatar
    ports:
      - "127.0.0.1:${KNOWLEDGE_BACKEND_PORT:-24000}:8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      # 应用自行用 python-dotenv 解析，保留现有带引号 JSON 和密钥的语义。
      - type: bind
        source: ${KNOWLEDGE_BACKEND_ENV_FILE:-../knowledge-accumulation-be/.env}
        target: /workspace/.env
        read_only: true
        bind:
          create_host_path: false
      - knowledge-backend-data:/workspace/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - registry
    init: true
    restart: unless-stopped
    stop_grace_period: 1m

  knowledge-frontend:
    build:
      context: ../knowledge-accumulation-fe
      dockerfile: Dockerfile
      args:
        VITE_DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
    image: knowledge-accumulation-fe:dev
    environment:
      BACKEND_UPSTREAM: knowledge-backend:8000
    ports:
      - "127.0.0.1:${KNOWLEDGE_FRONTEND_PORT:-24080}:80"
    depends_on:
      knowledge-backend:
        condition: service_healthy
    networks:
      - registry
    init: true
    restart: unless-stopped

  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
      args:
        MYSQL_VERSION: ${MYSQL_VERSION:-8.4}
    image: registry-mysql:${MYSQL_VERSION:-8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MySQL root 密码}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-registry}
      MYSQL_USER: ${MYSQL_USER:-registry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MySQL 业务账号密码}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - registry
    # 使用业务账号执行查询，确认数据库已初始化且可通过 TCP 访问。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1" --silent >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 1m

volumes:
  backend-data:
  knowledge-backend-data:
  mysql-data:

networks:
  registry:
    driver: bridge
