      context: ./knowledge-accumulation-fe
      dockerfile: Dockerfile
      args:
        VITE_DINGTALK_CORP_ID: ${DINGTALK_CORP_ID?请在 deploy .env 中定义 DINGTALK_CORP_ID}
    image: knowledge-accumulation-fe:dev
    environment:
      BACKEND_UPSTREAM: knowledge-backend:8000
    ports:
      - "127.0.0.1:${KNOWLEDGE_FRONTEND_PORT?请在 deploy .env 中定义 KNOWLEDGE_FRONTEND_PORT}:80"
    depends_on:
      knowledge-backend:
        condition: service_healthy
    networks:
      - registry
    init: true
    restart: unless-stopped

  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
      args:
        MYSQL_VERSION: ${MYSQL_VERSION?请在 deploy .env 中定义 MYSQL_VERSION}
    image: registry-mysql:${MYSQL_VERSION?请在 deploy .env 中定义 MYSQL_VERSION}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy .env 中定义 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE?请在 deploy .env 中定义 MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER?请在 deploy .env 中定义 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy .env 中定义 MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT?请在 deploy .env 中定义 MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - registry
    # 使用业务账号执行查询，确认数据库已初始化且可通过 TCP 访问。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD:?请在 deploy .env 中定义 MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER?请在 deploy .env 中定义 MYSQL_USER}" --database="$${MYSQL_DATABASE?请在 deploy .env 中定义 MYSQL_DATABASE}"
          --execute="SELECT 1" --silent >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 1m

volumes:
  backend-data:
  knowledge-backend-data:
  mysql-data:

networks:
  registry:
    driver: bridge
